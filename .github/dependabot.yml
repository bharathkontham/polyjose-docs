# Dependency updates arrive as PRs that go through review and CI like any
# other change. Actions stay pinned to full commit SHAs; Dependabot updates
# the SHA and its version comment together.
#
# Minor and patch updates are grouped into one PR per ecosystem; majors get
# their own PR. The cooldown waits a week after a release before proposing
# it, so a compromised release has time to be caught and pulled. Security
# updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
