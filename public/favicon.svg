<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
<title>polyjose</title>
<!--
  polyjose favicon: the light mark, switched to the dark colours by the
  browser's colour scheme. Some browsers ignore the media query in favicons
  and keep the light colours, so the light mark must read on dark tab bars
  as well: the white p carries the shape on any background.
-->
<style>@media (prefers-color-scheme: dark){.tile{fill:#2F4BA6}.key{fill:#F7C04A}}</style>
<rect class="tile" width="32" height="32" rx="7" fill="#16255A"/>
<g class="letter" fill="#FFFFFF">
  <path d="M6 7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v18a3 3 0 0 1-6 0Z"/>
  <circle cx="16" cy="14" r="8"/>
</g>
<path class="key" fill="#F2B22E" d="M16 9a3 3 0 0 1 1.4 5.653L18 18h-4l.6-3.347A3 3 0 0 1 16 9Z"/>
</svg>
